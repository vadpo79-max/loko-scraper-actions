name: Scrape Loko Fixtures

on:
  workflow_dispatch:        # ручной запуск кнопкой
  schedule:
    - cron: "0 6 * * 5"     # по пятницам 06:00 UTC
  push:                     # запускать при коммитах в эти файлы (если кнопки нет)
    branches: [ main ]
    paths:
      - "scraper.mjs"
      - "package.json"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Save previous fixtures
        run: cp fixtures.json fixtures.previous.json

      - name: Run scraper
        run: npm start

      - name: Protect against empty result
        run: |
          COUNT=$(node -e "const f=require('./fixtures.json'); console.log(Array.isArray(f.fixtures) ? f.fixtures.length : 0)")
          echo "Scraper produced $COUNT fixtures"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: scraper returned 0 fixtures; restoring previous fixtures.json"
            mv fixtures.previous.json fixtures.json
          else
            rm -f fixtures.previous.json
          fi

      - name: Commit fixtures.json and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures.json debug-schedule.txt debug-tickets.txt || true
          git commit -m "Update fixtures + debug [skip ci]" || echo "No changes"
          git push
